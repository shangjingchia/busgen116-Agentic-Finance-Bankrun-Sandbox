[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bankrun"
version = "0.1.0"
description = "Sandbox for studying AI-agent-delegated bank run dynamics"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "networkx>=3.4.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
